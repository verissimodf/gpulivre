name: Validate gpulivre Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # historico completo: o CI valida o patch contra o commit pristine do upstream

    - name: Inspecionar arvore de arquivos
      run: ls -la && ls -R

    - name: Validate Markdown and Script Syntax
      run: |
        echo "Validando arquivos do gpulivre..."
        if [ ! -f "README.md" ]; then echo "Erro: README.md ausente!"; exit 1; fi
        if [ ! -f "scripts/install-gpulivre.sh" ]; then echo "Erro: install-gpulivre.sh ausente!"; exit 1; fi

        bash -n scripts/install-gpulivre.sh
        echo "Tudo certo com a estrutura base!"

    - name: Verificar patch GA107 sobre upstream pristine
      run: |
        git worktree add --detach /tmp/upstream-pristine 1fe5c8c
        git -C /tmp/upstream-pristine apply --check "$GITHUB_WORKSPACE/patches/0001-support-ga107.patch"
        echo "Patch GA107 aplicável sobre upstream 1fc6d62 (v2.0.0)! OK"

    - name: Confirmar receitas GA107 no motor vendored
      run: |
        test -f upstream/gpu-unlock/kernel/gpu_unlock/recipes.c
        grep -q '#define GA107(id) { id, 0x177, &ga10x }' upstream/gpu-unlock/kernel/gpu_unlock/recipes.c
        grep -q 'GA107(0x2584)' upstream/gpu-unlock/kernel/gpu_unlock/recipes.c
        grep -q 'GA107(0x2582)' upstream/gpu-unlock/kernel/gpu_unlock/recipes.c
        git -C upstream/gpu-unlock apply --reverse --check /dev/stdin < patches/0001-support-ga107.patch \
          && echo "Motor vendored é exatamente pristine + patch GA107! OK"
